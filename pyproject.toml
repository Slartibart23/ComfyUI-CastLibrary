[project]
name = "comfyui-castlibrary"
description = "Cast Library: an image library inside ComfyUI with your own folder tree (#TEMP, PERSONS, BACKGROUNDS, ACCESSORIES, CLOTHES, any sub folders). Pick images in a gallery; upload, move and delete images and create, rename, move and delete folders right in the node (deleting goes to the recycle bin). Outputs image + mask (MaskEditor mask and colour stored with the image, rectangle or freehand) with crop to mask, optional resize and a 2048 px limit, plus filename, folder and folder_name."
version = "1.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Slartibart23/ComfyUI-CastLibrary"

[tool.comfy]
PublisherId = "slartibart23b"
DisplayName = "Cast Library"
Icon = ""
